# Réglages de la chaîne. Les voix, vitesses et dimensions sont FIGÉES :
# ne les modifier que sur décision explicite (cohérence de Bongo d'un épisode à l'autre).
video: {width: 1920, height: 1080, fps: 24}
positions: {left: 0.25, center: 0.5, right: 0.75}   # fraction de la largeur
voices:
  # Choisies d'après les notes de qualité de Kokoro (VOICES.md) et le caractère de chaque personnage.
  # FIGÉES dès la publication du premier épisode (1er décembre).
  bongo:    {voice: "am_michael", speed: 0.85}   # masculine, grave et chaleureuse
  parrot:   {voice: "af_bella",   speed: 0.90}   # vive, il répète tout
  frog:     {voice: "am_puck",    speed: 0.90}   # joueur, saute partout
  elephant: {voice: "af_heart",   speed: 0.90}   # grande et douce
  owl:      {voice: "af_kore",    speed: 0.90}   # posée, éveillée la nuit
  squirrel: {voice: "af_sky",     speed: 0.90}   # aiguë, va très vite
  bear:     {voice: "am_fenrir",  speed: 0.90}   # grave, toujours sommeil
  duck:     {voice: "af_aoede",   speed: 0.90}   # adore les éclaboussures
  fish:     {voice: "af_nicole",  speed: 0.90}   # douce, timide
  turtle:   {voice: "am_onyx",    speed: 0.90}   # grave, très lent
  goat:     {voice: "af_alloy",   speed: 0.90}   # grimpe partout
  eagle:    {voice: "af_sarah",   speed: 0.90}   # vole très haut
  rabbit:   {voice: "af_nova",    speed: 0.90}   # court vite
# model: "auto" = le modèle « Flash » gratuit le plus récent proposé par Google (choisi à chaque lancement).
# On peut écrire un nom précis à la place (ex. "gemini-3.8-flash") pour le figer.
llm: {model: "auto", temperature: 0.7, max_retries: 3}
asr: {model: "small.en", device: "cpu", compute_type: "int8", max_mismatch: 0.20}
qa:
  min_word_repeats: 8
  min_cards_per_word: 2
  max_words_per_sentence: 6
  prompt_pause_s: 3.0
  lesson_duration_s: [200, 260]
  review_duration_s: [300, 360]
  min_shot_s: 3
  # Estimation de durée avant la synthèse vocale (à recaler à l'étape 2 avec les vraies voix)
  estimate_words_per_s: 2.0
  estimate_min_line_s: 1.2
  gap_between_lines_s: 0.4
  scene_fade_s: 0.5
  # Au-delà de ce score (0 à 1), une quête est jugée trop proche d'une quête déjà utilisée
  quest_similarity_max: 0.75
audio: {music_db_under_voice: -20, loudness_lufs: -14}
publish: {time: "13:00", timezone: "Europe/Paris"}
upload: {enabled: false}
