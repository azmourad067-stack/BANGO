[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bongo"
version = "0.1.0"
description = "Fabrication des épisodes de « Bongo the Gorilla »"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.5",
    "Pillow>=10.1",
    "numpy>=1.26",
    "jinja2>=3.1",
]

[project.optional-dependencies]
voix = ["kokoro>=0.9.4", "soundfile>=0.12"]
controle = ["faster-whisper>=1.0"]
scenarios = ["google-genai>=1.0"]
dev = ["pytest>=8"]
tout = ["kokoro>=0.9.4", "soundfile>=0.12", "faster-whisper>=1.0", "google-genai>=1.0", "pytest>=8"]

[project.scripts]
bongo = "bongo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
